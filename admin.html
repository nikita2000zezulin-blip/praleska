/* ============================================================
   Ограничение попыток входа: 3 неудачи — пауза 5 минут.
   Счётчик живёт в localStorage этого браузера, поэтому защищает
   от подбора «вручную», но не заменяет серверную защиту.
   ============================================================ */
const MAX_TRIES = 3;
const LOCK_MS = 5 * 60 * 1000;
const STORE_KEY = 'praleska_login_guard';

function readGuard(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return { fails: Number(raw.fails) || 0, until: Number(raw.until) || 0 };
  }catch(err){
    return { fails: 0, until: 0 };
  }
}

function writeGuard(guard){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(guard));
  }catch(err){ /* приватный режим — просто не запоминаем */ }
}

function clearGuard(){
  try{
    localStorage.removeItem(STORE_KEY);
  }catch(err){ /* нечего чистить */ }
}

function lockLeft(){
  return Math.max(0, readGuard().until - Date.now());
}

function formatLeft(ms){
  const total = Math.ceil(ms / 1000);
  const min = Math.floor(total / 60);
  const sec = String(total % 60).padStart(2, '0');
  return min + ':' + sec;
}

let lockTimer = null;

function showError(text){
  loginError.textContent = text;
  loginError.classList.add('show');
}

/* Пока идёт пауза — форма заблокирована, а на кнопке тикает обратный отсчёт. */
function applyLock(){
  const left = lockLeft();
  if(left <= 0){
    clearInterval(lockTimer);
    lockTimer = null;
    loginBtn.disabled = false;
    loginBtn.textContent = 'Войти';
    loginError.classList.remove('show');
    return;
  }
  loginBtn.disabled = true;
  loginBtn.textContent = 'Повтор через ' + formatLeft(left);
  showError('Слишком много неудачных попыток. Вход заблокирован на 5 минут.');
  if(!lockTimer) lockTimer = setInterval(applyLock, 1000);
}

if(lockLeft() > 0) applyLock();

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if(lockLeft() > 0){ applyLock(); return; }

  loginError.classList.remove('show');
  loginBtn.disabled = true;
  loginBtn.textContent = 'Входим...';
  try{
    await auth.signInWithEmailAndPassword(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value
    );
    clearGuard();
  }catch(err){
    const fails = readGuard().fails + 1;
    if(fails >= MAX_TRIES){
      writeGuard({ fails: 0, until: Date.now() + LOCK_MS });
      document.getElementById('password').value = '';
      applyLock();
      return;
    }
    writeGuard({ fails, until: 0 });
    const left = MAX_TRIES - fails;
    showError('Неверный email или пароль. Осталось попыток: ' + left + '.');
  }finally{
    if(lockLeft() <= 0){
      loginBtn.disabled = false;
      loginBtn.textContent = 'Войти';
    }
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

function renderRows(){
  bouquetRows.innerHTML = '';
  bouquets.forEach((b) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="info">
        <img class="thumb" src="${b.img}" alt="${b.name}" loading="lazy">
        <div>
          <div class="name">${b.name}</div>
          <div class="meta">${b.tag} · ${b.price}</div>
          <div class="status-label" id="label-${b.id}">Загрузка...</div>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-${b.id}" checked>
        <span class="track"></span>
      </label>`;
    bouquetRows.appendChild(row);

    db.collection('bouquets').doc(b.id).onSnapshot((doc) => {
      const available = !doc.exists || doc.data().available !== false;
      document.getElementById('toggle-' + b.id).checked = available;
      document.getElementById('label-' + b.id).textContent = available ? 'В наличии' : 'Под заказ';
    });

    document.getElementById('toggle-' + b.id).addEventListener('change', async (e) => {
      const available = e.target.checked;
      try{
        await db.collection('bouquets').doc(b.id).set({available}, {merge:true});
        saveNote.textContent = 'Сохранено ✓';
        setTimeout(() => saveNote.textContent = '', 1500);
      }catch(err){
        saveNote.textContent = 'Не удалось сохранить — проверьте подключение.';
      }
    });
  });
}

function formatOrderTime(iso){
  try{
    return new Date(iso).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  }catch(err){
    return '';
  }
}

/* История заявок хранится в Supabase; функция /api/orders проверяет
   Firebase ID-токен текущего админа и только тогда отдаёт данные. */
async function loadOrders(){
  ordersList.innerHTML = '<p class="orders-empty">Загрузка...</p>';
  try{
    const token = await auth.currentUser.getIdToken();
    const res = await fetch(API_BASE + '/get-orders', { headers: { Authorization: 'Bearer ' + token } });
    if(!res.ok) throw new Error('bad status');
    const { orders } = await res.json();

    if(!orders || !orders.length){
      ordersList.innerHTML = '<p class="orders-empty">Заявок пока нет.</p>';
      return;
    }

    ordersList.innerHTML = '';
    orders.forEach((o) => {
      const row = document.createElement('div');
      row.className = 'order';

      const top = document.createElement('div');
      top.className = 'order-top';
      const name = document.createElement('span');
      name.textContent = o.name || '—';

      const topRight = document.createElement('span');
      topRight.className = 'order-top-right';
      const time = document.createElement('span');
      time.className = 'order-time';
      time.textContent = formatOrderTime(o.created_at);
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'order-delete';
      delBtn.textContent = 'Удалить';
      delBtn.addEventListener('click', () => deleteOrder(o.id, row));
      topRight.append(time, delBtn);

      top.append(name, topRight);

      const meta = document.createElement('div');
      meta.className = 'order-meta';
      meta.textContent = [o.phone, o.occasion].filter(Boolean).join(' · ');

      row.append(top, meta);

      if(o.comment){
        const comment = document.createElement('div');
        comment.className = 'order-comment';
        comment.textContent = o.comment;
        row.append(comment);
      }

      ordersList.appendChild(row);
    });
  }catch(err){
    ordersList.innerHTML = '<p class="orders-error">Не удалось загрузить заявки.</p>';
  }
}

async function deleteOrder(id, row){
  if(!confirm('Удалить эту заявку?')) return;
  try{
    const token = await auth.currentUser.getIdToken();
    const res = await fetch(API_BASE + '/get-orders?id=' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token },
    });
    if(!res.ok) throw new Error('bad status');
    row.remove();
    if(!ordersList.children.length){
      ordersList.innerHTML = '<p class="orders-empty">Заявок пока нет.</p>';
    }
  }catch(err){
    alert('Не удалось удалить заявку — проверьте подключение.');
  }
}
</script>
</body>
</html>
